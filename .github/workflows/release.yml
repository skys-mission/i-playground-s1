# 打 tag 触发：构建 standalone 产物，拼装成免安装 zip 并发布到 GitHub Releases。
# 手动触发（workflow_dispatch）只构建并把 zip 上传为 workflow 产物，不发 Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package portable zip
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          scripts/package-release.sh "i-playground-s1-${ref:-manual}-portable"

      - name: Upload zip as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="Portable build — unzip, install Node.js 22+, then run start.bat (Windows) or sh start.sh (macOS/Linux) and open http://localhost:3000. One zip covers macOS/Linux/Windows on x64 and ARM64. Details: README-RUN.md inside the zip."
          args=(--title "$tag" --notes "$notes")
          case "$tag" in
            *preview*|*rc*|*beta*) args+=(--prerelease) ;;
          esac
          gh release create "$tag" dist/*.zip "${args[@]}"
